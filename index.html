<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzman Matematik - Eğlenceli Öğrenme Platformu</title>
    <meta name="description" content="Matematik videoları, konu anlatımları, çalışma kağıtları ve eğlenceli oyunlar.">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>➗</text></svg>">
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#" class="logo">UzmanMatematik</a>
            <ul class="nav-links">
                <li><a href="#videos">Videolar</a></li>
                <li><a href="#resources">Kaynaklar</a></li>
                <li><a href="#games">Oyunlar</a></li>
				<li><a href="#games2">konu</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <div class="hero">
        <div class="container">
            <h1>Matematiği Keşfedin</h1>
            <p>Videolar, oyunlar ve indirilebilir kaynaklarla matematiği eğlenerek öğrenin.</p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Videos Section -->
        <section id="videos">
            <h2 class="section-title">Konu Anlatım Videoları</h2>
            <div id="video-grid" class="grid">
                <!-- Video cards will optionally appear here -->
            </div>
        </section>

        <!-- Resources Section -->
        <section id="resources">
            <h2 class="section-title">İndirilebilir Kaynaklar</h2>
            <div id="resource-grid" class="grid">
                <!-- Resource cards will appear here -->
            </div>
        </section>

        <!-- Games Section -->
        <section id="games">
            <h2 class="section-title">Eğitici Oyunlar</h2>
            <div id="game-grid" class="grid">
                <!-- Game cards will appear here -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Uzman Matematik. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
